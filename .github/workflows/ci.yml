name: Build and Release

on:
  push:
    branches:
      - "develop"
      - "release-*"
      - "master"
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"
      - "COPYING.md"

      # Workflows
      - ".github/workflows/build.yml"
      - ".github/actions/package/**"
      - ".github/actions/setup-dependencies/**"
  pull_request:
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"
      - "COPYING.md"

      # Workflows
      - ".github/workflows/build.yml"
      - ".github/actions/package/**"
      - ".github/actions/setup-dependencies/**"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    permissions:
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: Linux
            base-cmake-preset: linux

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            base-cmake-preset: linux

          - os: windows-2022
            artifact-name: Windows-MinGW-w64
            base-cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86

          - os: windows-11-arm
            artifact-name: Windows-MinGW-arm64
            base-cmake-preset: windows_mingw
            msystem: CLANGARM64
            vcvars-arch: arm64

          - os: macos-14
            artifact-name: macOS
            base-cmake-preset: macos
            macosx-deployment-target: 12.0

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      ##
      # API KEY RETRIEVAL AND PATCHING
      ##

      - name: Replace CMakeLists.txt with upstream version
        shell: bash
        run: |
          echo "🔄 Replacing CMakeLists.txt with upstream version..."
          
          # Backup original (for debugging if needed)
          cp CMakeLists.txt CMakeLists.txt.backup
          
          # Download and replace with upstream CMakeLists.txt
          curl -fsSL -o CMakeLists.txt "https://raw.githubusercontent.com/PrismLauncher/PrismLauncher/refs/heads/develop/CMakeLists.txt"
          
          if [ ! -f CMakeLists.txt ]; then
            echo "❌ Failed to download upstream CMakeLists.txt"
            exit 1
          fi
          
          echo "✅ Successfully replaced CMakeLists.txt with upstream version"
          
          # Verify the API keys are present
          echo "🔍 Verifying API keys are present..."
          
          if grep -q 'set(Launcher_MSA_CLIENT_ID' CMakeLists.txt && \
             grep -q 'set(Launcher_CURSEFORGE_API_KEY' CMakeLists.txt && \
             grep -q 'set(Launcher_IMGUR_CLIENT_ID' CMakeLists.txt; then
            echo "✅ All API keys found in upstream CMakeLists.txt"
            
            # Show what we got (first 20 chars for verification)
            echo "📝 API Keys found:"
            echo "  • MSA Client ID: $(grep 'set(Launcher_MSA_CLIENT_ID' CMakeLists.txt | sed 's/.*"\([^"]*\)".*/\1/' | cut -c1-20)..."
            echo "  • CurseForge Key: $(grep 'set(Launcher_CURSEFORGE_API_KEY' CMakeLists.txt | sed 's/.*"\([^"]*\)".*/\1/' | cut -c1-20)..."
            echo "  • Imgur Client ID: $(grep 'set(Launcher_IMGUR_CLIENT_ID' CMakeLists.txt | sed 's/.*"\([^"]*\)".*/\1/' | cut -c1-20)..."
            
            if grep -q 'set(MACOSX_SPARKLE_UPDATE_PUBLIC_KEY' CMakeLists.txt; then
              echo "  • Sparkle Key: $(grep 'set(MACOSX_SPARKLE_UPDATE_PUBLIC_KEY' CMakeLists.txt | sed 's/.*"\([^"]*\)".*/\1/' | cut -c1-20)..."
            fi
          else
            echo "❌ Some API keys missing from upstream CMakeLists.txt"
            exit 1
          fi

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-architecture: ${{ matrix.qt-architecture }}

      ##
      # BUILD
      ##

      - name: Get CMake preset
        id: cmake-preset
        env:
          BASE_CMAKE_PRESET: ${{ matrix.base-cmake-preset }}
          PRESET_TYPE: ci
        run: |
          echo preset="$BASE_CMAKE_PRESET"_"$PRESET_TYPE" >> "$GITHUB_OUTPUT"

      - name: Run CMake workflow
        env:
          CMAKE_PRESET: ${{ steps.cmake-preset.outputs.preset }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
          BUILD_PLATFORM: official
        run: |
          echo "🏗️ Starting CMake build with upstream API keys..."
          echo "🔄 Using repository: ${{ github.repository }}"
          cmake --workflow --preset "$CMAKE_PRESET" -DLauncher_UPDATER_GITHUB_REPO="https://github.com/${{ github.repository }}"

      ##
      # PACKAGE
      ##

      - name: Get version info
        id: version-info
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.version-info.outputs.version }}
          build-type: Release
          artifact-name: ${{ matrix.artifact-name }}
          cmake-preset: ${{ steps.cmake-preset.outputs.preset }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.version-info.outputs.version }}
          build-type: Release
          artifact-name: ${{ matrix.artifact-name }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.version-info.outputs.version }}
          build-type: Release
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

      - name: Prepare release artifacts
        shell: bash
        run: |
          echo "🔍 Checking what artifacts were created..."
          echo "Current directory contents:"
          ls -la
          
          echo ""
          echo "🏗️ Preparing release artifacts for ${{ matrix.artifact-name }}..."
          
          # Create release directory
          mkdir -p release-artifacts
          
          case "${{ matrix.artifact-name }}" in
            "Linux")
              # Look for Linux artifacts
              if ls *.tar.gz 1> /dev/null 2>&1; then
                for file in *.tar.gz; do
                  cp "$file" "release-artifacts/PrismLauncher-Linux-Qt6-${{ steps.version-info.outputs.version }}.tar.gz"
                  echo "✅ Copied: $file → PrismLauncher-Linux-Qt6-${{ steps.version-info.outputs.version }}.tar.gz"
                done
              fi
              if ls *.AppImage 1> /dev/null 2>&1; then
                for file in *.AppImage; do
                  cp "$file" "release-artifacts/PrismLauncher-Linux-x86_64.AppImage"
                  echo "✅ Copied: $file → PrismLauncher-Linux-x86_64.AppImage"
                done
              fi
              if ls *.deb 1> /dev/null 2>&1; then
                for file in *.deb; do
                  cp "$file" "release-artifacts/PrismLauncher-Linux-${{ steps.version-info.outputs.version }}.deb"
                  echo "✅ Copied: $file → PrismLauncher-Linux-${{ steps.version-info.outputs.version }}.deb"
                done
              fi
              ;;
            "Linux-aarch64")
              if ls *.tar.gz 1> /dev/null 2>&1; then
                for file in *.tar.gz; do
                  cp "$file" "release-artifacts/PrismLauncher-Linux-Qt6-arm64-${{ steps.version-info.outputs.version }}.tar.gz"
                  echo "✅ Copied: $file → PrismLauncher-Linux-Qt6-arm64-${{ steps.version-info.outputs.version }}.tar.gz"
                done
              fi
              if ls *.AppImage 1> /dev/null 2>&1; then
                for file in *.AppImage; do
                  cp "$file" "release-artifacts/PrismLauncher-Linux-aarch64.AppImage"
                  echo "✅ Copied: $file → PrismLauncher-Linux-aarch64.AppImage"
                done
              fi
              ;;
            "Windows-MinGW-w64")
              # Copy all Windows artifacts with proper naming
              if ls *Portable*.zip 1> /dev/null 2>&1; then
                for file in *Portable*.zip; do
                  cp "$file" "release-artifacts/PrismLauncher-Windows-MinGW-w64-Portable-${{ steps.version-info.outputs.version }}.zip"
                  echo "✅ Copied: $file → PrismLauncher-Windows-MinGW-w64-Portable-${{ steps.version-info.outputs.version }}.zip"
                done
              fi
              if ls *Setup*.exe 1> /dev/null 2>&1; then
                for file in *Setup*.exe; do
                  cp "$file" "release-artifacts/PrismLauncher-Windows-MinGW-w64-Setup-${{ steps.version-info.outputs.version }}.exe"
                  echo "✅ Copied: $file → PrismLauncher-Windows-MinGW-w64-Setup-${{ steps.version-info.outputs.version }}.exe"
                done
              fi
              # Also copy main zip if it exists
              if ls PrismLauncher-Windows-*.zip 1> /dev/null 2>&1; then
                for file in PrismLauncher-Windows-*.zip; do
                  if [[ ! "$file" =~ Portable ]]; then
                    cp "$file" "release-artifacts/PrismLauncher-Windows-MinGW-w64-${{ steps.version-info.outputs.version }}.zip"
                    echo "✅ Copied: $file → PrismLauncher-Windows-MinGW-w64-${{ steps.version-info.outputs.version }}.zip"
                  fi
                done
              fi
              ;;
            "Windows-MinGW-arm64")
              if ls *Portable*.zip 1> /dev/null 2>&1; then
                for file in *Portable*.zip; do
                  cp "$file" "release-artifacts/PrismLauncher-Windows-MinGW-arm64-Portable-${{ steps.version-info.outputs.version }}.zip"
                  echo "✅ Copied: $file → PrismLauncher-Windows-MinGW-arm64-Portable-${{ steps.version-info.outputs.version }}.zip"
                done
              fi
              if ls *Setup*.exe 1> /dev/null 2>&1; then
                for file in *Setup*.exe; do
                  cp "$file" "release-artifacts/PrismLauncher-Windows-MinGW-arm64-Setup-${{ steps.version-info.outputs.version }}.exe"
                  echo "✅ Copied: $file → PrismLauncher-Windows-MinGW-arm64-Setup-${{ steps.version-info.outputs.version }}.exe"
                done
              fi
              if ls PrismLauncher-Windows-*.zip 1> /dev/null 2>&1; then
                for file in PrismLauncher-Windows-*.zip; do
                  if [[ ! "$file" =~ Portable ]]; then
                    cp "$file" "release-artifacts/PrismLauncher-Windows-MinGW-arm64-${{ steps.version-info.outputs.version }}.zip"
                    echo "✅ Copied: $file → PrismLauncher-Windows-MinGW-arm64-${{ steps.version-info.outputs.version }}.zip"
                  fi
                done
              fi
              ;;
            "macOS")
              if ls *.zip 1> /dev/null 2>&1; then
                for file in *.zip; do
                  cp "$file" "release-artifacts/PrismLauncher-macOS-${{ steps.version-info.outputs.version }}.zip"
                  echo "✅ Copied: $file → PrismLauncher-macOS-${{ steps.version-info.outputs.version }}.zip"
                done
              fi
              if ls *.dmg 1> /dev/null 2>&1; then
                for file in *.dmg; do
                  cp "$file" "release-artifacts/PrismLauncher-macOS-${{ steps.version-info.outputs.version }}.dmg"
                  echo "✅ Copied: $file → PrismLauncher-macOS-${{ steps.version-info.outputs.version }}.dmg"
                done
              fi
              ;;
          esac
          
          echo ""
          echo "📦 Final release artifacts:"
          ls -la release-artifacts/ 2>/dev/null || echo "No release artifacts created"

      # Store build info for README generation
      - name: Save build metadata
        shell: bash
        run: |
          mkdir -p build-metadata
          
          # Generate proper artifact name based on platform
          case "${{ matrix.artifact-name }}" in
            "Linux")
              PROPER_NAME="PrismLauncher-Linux-Qt6-${{ steps.version-info.outputs.version }}"
              ;;
            "Linux-aarch64")
              PROPER_NAME="PrismLauncher-Linux-Qt6-arm64-${{ steps.version-info.outputs.version }}"
              ;;
            "Windows-MinGW-w64")
              PROPER_NAME="PrismLauncher-Windows-MinGW-w64-${{ steps.version-info.outputs.version }}"
              ;;
            "Windows-MinGW-arm64")
              PROPER_NAME="PrismLauncher-Windows-MinGW-arm64-${{ steps.version-info.outputs.version }}"
              ;;
            "macOS")
              PROPER_NAME="PrismLauncher-macOS-${{ steps.version-info.outputs.version }}"
              ;;
            *)
              PROPER_NAME="PrismLauncher-${{ matrix.artifact-name }}-${{ steps.version-info.outputs.version }}"
              ;;
          esac
          
          cat > build-metadata/${{ matrix.artifact-name }}.json << EOF
          {
            "artifact_name": "${{ matrix.artifact-name }}",
            "proper_name": "$PROPER_NAME",
            "version": "${{ steps.version-info.outputs.version }}",
            "full_hash": "${{ steps.version-info.outputs.full_hash }}",
            "build_date": "${{ steps.version-info.outputs.date }}",
            "timestamp": "${{ steps.version-info.outputs.timestamp }}",
            "tag": "${{ steps.version-info.outputs.tag }}",
            "os": "${{ matrix.os }}",
            "cmake_preset": "${{ steps.cmake-preset.outputs.preset }}",
            "api_keys_source": "upstream_prism_launcher",
            "api_keys_updated": "$(date -u +%Y-%m-%d_%H:%M:%S)",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ matrix.artifact-name }}
          path: build-metadata/${{ matrix.artifact-name }}.json

      # Upload release artifacts with proper naming
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-name }}
          path: release-artifacts/*
          if-no-files-found: warn

  # Create GitHub Release with all artifacts
  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      always() && 
      (needs.build.result == 'success') &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release-'))
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version info
        id: version-info
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Generate a semantic version number based on date
          echo "semantic_version=$(date -u +%Y.%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets

      - name: Organize release assets
        run: |
          echo "=== ORGANIZING RELEASE ARTIFACTS ==="
          
          # List what we downloaded
          echo "Downloaded artifacts structure:"
          find release-assets -type f | sort
          
          # The download creates subdirectories for each artifact
          # Move all files to the root of release-assets and flatten directory structure
          find release-assets -mindepth 2 -type f \( -name "PrismLauncher-*.zip" -o -name "PrismLauncher-*.tar.gz" -o -name "PrismLauncher-*.dmg" -o -name "PrismLauncher-*.AppImage" -o -name "PrismLauncher-*.deb" -o -name "PrismLauncher-*.exe" \) -exec mv {} release-assets/ \;
          
          # Clean up empty directories
          find release-assets -mindepth 1 -type d -empty -delete
          
          echo "Final release assets:"
          find release-assets -type f | sort
          
          # Validate we have assets
          ASSET_COUNT=$(find release-assets -type f \( -name "PrismLauncher-*.zip" -o -name "PrismLauncher-*.tar.gz" -o -name "PrismLauncher-*.dmg" -o -name "PrismLauncher-*.AppImage" -o -name "PrismLauncher-*.deb" -o -name "PrismLauncher-*.exe" \) | wc -l)
          
          if [ $ASSET_COUNT -eq 0 ]; then
            echo "❌ ERROR: No release assets found!"
            echo "Contents of release-assets:"
            ls -la release-assets/ || echo "Directory is empty"
            exit 1
          fi
          
          echo "✅ Found $ASSET_COUNT release assets"

      - name: Delete existing releases and tags
        run: |
          echo "🗑️ Deleting existing releases and tags..."
          
          # Delete all existing releases
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/releases" \
            --jq '.[].id' | while read -r release_id; do
              if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
                echo "Deleting release ID: $release_id"
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "/repos/${{ github.repository }}/releases/$release_id" || echo "Failed to delete release $release_id"
              fi
            done
          
          # Delete all existing tags
          git tag -l | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting tag: $tag"
              git push --delete origin "$tag" 2>/dev/null || echo "Tag $tag already deleted or doesn't exist remotely"
              git tag -d "$tag" 2>/dev/null || echo "Tag $tag already deleted locally"
            fi
          done
          
          echo "✅ Cleanup completed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tag
        run: |
          TAG="${{ steps.version-info.outputs.tag }}"
          echo "Creating release tag: $TAG"
          
          git tag $TAG
          git push origin $TAG
          
          echo "✅ Created and pushed tag: $TAG"

      - name: Generate release body
        run: |
          # Get changelog from recent commits (last 20 commits to capture sync merges)
          echo "📋 Generating changelog from recent commits..."
          
          # Look for merge commits from sync workflow
          CHANGELOG=""
          while IFS= read -r commit_line; do
            if [[ "$commit_line" == *"Merge remote-tracking branch 'upstream/develop'"* ]] || [[ "$commit_line" == *"upstream"* ]]; then
              # Extract just the hash for this merge commit
              MERGE_HASH=$(echo "$commit_line" | awk '{print $1}')
              
              # Get the individual commits that were merged (excluding our own commits)
              while IFS= read -r individual_commit; do
                # Skip empty lines and our own modification commits
                if [[ -n "$individual_commit" ]] && [[ "$individual_commit" != *"bypass"* ]] && [[ "$individual_commit" != *"Crism"* ]] && [[ "$individual_commit" != *"coffeegrind"* ]]; then
                  HASH=$(echo "$individual_commit" | awk '{print $1}')
                  MESSAGE=$(echo "$individual_commit" | cut -d' ' -f2-)
                  
                  # Format the changelog entry
                  CHANGELOG="${CHANGELOG}- ${MESSAGE} ([${HASH:0:7}](https://github.com/PrismLauncher/PrismLauncher/commit/${HASH}))\n"
                fi
              done <<< "$(git log --oneline ${MERGE_HASH}^1..${MERGE_HASH}^2 2>/dev/null | head -10)"
            fi
          done <<< "$(git log --oneline -20)"
          
          # If no changelog entries found, add a default message
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="- Minor updates and improvements\n"
          fi
          
          cat > RELEASE_BODY.md << EOF
          🌈 Download from our official site at <https://prismlauncher.org/download>

          ## Changelog

          ### Added
          - Automatic mod download bypass for blocked CurseForge/Flame mods
          - Direct download support for ATLauncher browser-required mods
          
          ### Fixed
          $(echo -e "$CHANGELOG")

          ---

          *Based on Prism Launcher with mod download modifications*
          EOF

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version-info.outputs.tag }}
          name: "Crism Launcher ${{ steps.version-info.outputs.semantic_version }}"
          bodyFile: RELEASE_BODY.md
          artifacts: "release-assets/*"
          draft: false
          prerelease: false
          allowUpdates: true
          makeLatest: true
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release created successfully
        run: |
          TAG="${{ steps.version-info.outputs.tag }}"
          ASSET_COUNT=$(find release-assets -type f | wc -l)
          
          echo "🎉 === RELEASE CREATED SUCCESSFULLY === 🎉"
          echo ""
          echo "📋 Release Details:"
          echo "  • Tag: $TAG" 
          echo "  • Name: Prism Launcher ${{ steps.version-info.outputs.date }}"
          echo "  • Assets: $ASSET_COUNT files"
          echo ""
          echo "🔗 Release URL:"
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo ""
          echo "📦 Assets uploaded:"
          find release-assets -type f | sort | sed 's/release-assets\//  • /'

  # Update README after release is created
  update-readme:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    if: |
      always() && 
      (needs.build.result == 'success') && 
      (needs.create-release.result == 'success') &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release-'))
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          pattern: build-metadata-*
          path: build-metadata
          merge-multiple: true

      - name: Generate README with release download links
        shell: bash
        run: |
          echo "🔍 Fetching latest release information..."
          
          # Wait a moment for GitHub API to sync
          sleep 10
          
          # Get the latest release information with error handling
          set +e  # Don't exit on error
          LATEST_RELEASE_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/releases/latest" 2>/dev/null)
          API_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          if [ $API_EXIT_CODE -ne 0 ] || [ -z "$LATEST_RELEASE_JSON" ] || [ "$LATEST_RELEASE_JSON" = "null" ]; then
            echo "⚠️ Could not fetch latest release info, checking all releases..."
            
            # Fallback: get the most recent release from all releases
            ALL_RELEASES_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/releases" 2>/dev/null || echo "[]")
            
            if [ "$ALL_RELEASES_JSON" != "[]" ] && [ -n "$ALL_RELEASES_JSON" ]; then
              LATEST_RELEASE_JSON=$(echo "$ALL_RELEASES_JSON" | jq '.[0]' 2>/dev/null || echo "{}")
            else
              echo "❌ No releases found, creating README without download links"
              LATEST_RELEASE_JSON="{}"
            fi
          fi
          
          # Extract release information with fallbacks
          if [ "$LATEST_RELEASE_JSON" != "{}" ] && [ -n "$LATEST_RELEASE_JSON" ]; then
            LATEST_TAG=$(echo "$LATEST_RELEASE_JSON" | jq -r '.tag_name // "unknown"')
            LATEST_RELEASE_DATE=$(echo "$LATEST_RELEASE_JSON" | jq -r '.published_at // "unknown"' | cut -d'T' -f1)
            LATEST_RELEASE_URL=$(echo "$LATEST_RELEASE_JSON" | jq -r '.html_url // "https://github.com/${{ github.repository }}/releases"')
            
            echo "✅ Found release: $LATEST_TAG ($LATEST_RELEASE_DATE)"
          else
            echo "⚠️ No release data available, using fallbacks"
            LATEST_TAG="unknown"
            LATEST_RELEASE_DATE="unknown"
            LATEST_RELEASE_URL="https://github.com/${{ github.repository }}/releases"
            LATEST_RELEASE_JSON="{\"assets\":[]}"
          fi
          
          # Start README generation
          cat > README.md << 'HEADER'
          # Crism Launcher

          [![Build Status](https://github.com/${{ github.repository }}/actions/workflows/ci.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/ci.yml)
          [![Latest Release](https://img.shields.io/github/v/release/${{ github.repository }})](https://github.com/${{ github.repository }}/releases/latest)

          A Prism Launcher fork with modified mod downloading behavior to bypass blocked mod restrictions.

          ## Changes from Upstream

          **Mod Download Modifications:**
          - Bypasses "blocked mods" dialog for CurseForge/Flame modpacks
          - Automatically generates download URLs for mods that lack official third-party download links
          - Treats ATLauncher browser-required downloads as direct downloads
          - Allows automatic installation of previously restricted mods

          ### Available Builds

          | Platform | Download |
          |----------|----------|
          HEADER

          # Get all release assets with error handling
          if [ "$LATEST_RELEASE_JSON" != "{}" ] && [ -n "$LATEST_RELEASE_JSON" ]; then
            echo "$LATEST_RELEASE_JSON" | jq -r '.assets[]? | "\(.name)|\(.browser_download_url)"' > assets_list.txt 2>/dev/null || touch assets_list.txt
          else
            touch assets_list.txt
          fi
          
          # Check if we have any assets
          ASSET_COUNT=$(wc -l < assets_list.txt)
          echo "📦 Found $ASSET_COUNT release assets"
          
          # Process build metadata and create download table with direct release links
          if [ -d "build-metadata" ] && [ "$(ls -A build-metadata 2>/dev/null)" ]; then
            echo "📋 Processing $(ls build-metadata/*.json 2>/dev/null | wc -l) build metadata files..."
            for metadata_file in build-metadata/*.json; do
              if [ -f "$metadata_file" ]; then
                echo "  Processing: $(basename "$metadata_file")"
                
                # Debug: show file contents
                echo "    File contents:"
                cat "$metadata_file" || echo "    Error reading file"
                
                ARTIFACT_NAME=$(jq -r '.artifact_name // "unknown"' "$metadata_file" 2>/dev/null || echo "unknown")
                VERSION=$(jq -r '.version // "unknown"' "$metadata_file" 2>/dev/null || echo "unknown")
                
                echo "    Parsed - Artifact: $ARTIFACT_NAME, Version: $VERSION"
                
                if [ "$ARTIFACT_NAME" = "unknown" ]; then
                  echo "    ⚠️ Warning: Could not parse artifact name from $metadata_file"
                  continue
                fi
                
                # Debug: show current assets list preview
                echo "    Available assets (first 3):"
                head -3 assets_list.txt 2>/dev/null || echo "    No assets found"
                
                # Process each platform and find matching assets
                echo "    Processing platform: $ARTIFACT_NAME"
                
                # Set error handling for this section
                set +e  # Don't exit on error in this section
                
                case "$ARTIFACT_NAME" in
                  "Linux")
                    echo "    → Processing Linux platform"
                    DISPLAY_NAME="Linux (Qt6)"
                    # Look for tar.gz, AppImage, and deb files
                    TARBALL=$(grep "PrismLauncher-Linux-Qt6.*\.tar\.gz" assets_list.txt 2>/dev/null | head -1)
                    APPIMAGE=$(grep "PrismLauncher-Linux.*\.AppImage" assets_list.txt 2>/dev/null | head -1)
                    DEB=$(grep "PrismLauncher-Linux.*\.deb" assets_list.txt 2>/dev/null | head -1)
                    
                    echo "    → Found: TARBALL='$TARBALL', APPIMAGE='$APPIMAGE', DEB='$DEB'"
                    
                    DOWNLOAD_LINKS=""
                    if [ -n "$TARBALL" ]; then
                      FILENAME=$(echo "$TARBALL" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$TARBALL" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        echo "    → Added tarball link: $FILENAME"
                      fi
                    fi
                    if [ -n "$APPIMAGE" ]; then
                      FILENAME=$(echo "$APPIMAGE" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$APPIMAGE" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added AppImage link: $FILENAME"
                      fi
                    fi
                    if [ -n "$DEB" ]; then
                      FILENAME=$(echo "$DEB" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$DEB" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added DEB link: $FILENAME"
                      fi
                    fi
                    ;;
                  "Linux-aarch64")
                    echo "    → Processing Linux ARM64 platform"
                    DISPLAY_NAME="Linux ARM64 (Qt6)"  
                    # Look for tar.gz and AppImage files
                    TARBALL=$(grep "PrismLauncher-Linux-Qt6-arm64.*\.tar\.gz" assets_list.txt 2>/dev/null | head -1)
                    APPIMAGE=$(grep "PrismLauncher-Linux-aarch64.*\.AppImage" assets_list.txt 2>/dev/null | head -1)
                    
                    echo "    → Found: TARBALL='$TARBALL', APPIMAGE='$APPIMAGE'"
                    
                    DOWNLOAD_LINKS=""
                    if [ -n "$TARBALL" ]; then
                      FILENAME=$(echo "$TARBALL" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$TARBALL" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        echo "    → Added tarball link: $FILENAME"
                      fi
                    fi
                    if [ -n "$APPIMAGE" ]; then
                      FILENAME=$(echo "$APPIMAGE" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$APPIMAGE" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added AppImage link: $FILENAME"
                      fi
                    fi
                    ;;
                  "Windows-MinGW-w64")
                    echo "    → Processing Windows x64 platform"
                    DISPLAY_NAME="Windows MinGW x64"
                    # Look for portable zip, setup exe, and main zip
                    PORTABLE_ZIP=$(grep "PrismLauncher-Windows-MinGW-w64-Portable.*\.zip" assets_list.txt 2>/dev/null | head -1)
                    SETUP_EXE=$(grep "PrismLauncher-Windows-MinGW-w64-Setup.*\.exe" assets_list.txt 2>/dev/null | head -1)
                    MAIN_ZIP=$(grep "PrismLauncher-Windows-MinGW-w64-[^P][^o].*\.zip" assets_list.txt 2>/dev/null | head -1)
                    
                    echo "    → Found: PORTABLE='$PORTABLE_ZIP', SETUP='$SETUP_EXE', MAIN='$MAIN_ZIP'"
                    
                    DOWNLOAD_LINKS=""
                    if [ -n "$PORTABLE_ZIP" ]; then
                      FILENAME=$(echo "$PORTABLE_ZIP" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$PORTABLE_ZIP" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        echo "    → Added portable link: $FILENAME"
                      fi
                    fi
                    if [ -n "$SETUP_EXE" ]; then
                      FILENAME=$(echo "$SETUP_EXE" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$SETUP_EXE" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added setup link: $FILENAME"
                      fi
                    fi
                    if [ -n "$MAIN_ZIP" ]; then
                      FILENAME=$(echo "$MAIN_ZIP" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$MAIN_ZIP" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added main link: $FILENAME"
                      fi
                    fi
                    ;;
                  "Windows-MinGW-arm64")
                    echo "    → Processing Windows ARM64 platform"
                    DISPLAY_NAME="Windows MinGW ARM64"
                    # Look for portable zip, setup exe, and main zip
                    PORTABLE_ZIP=$(grep "PrismLauncher-Windows-MinGW-arm64-Portable.*\.zip" assets_list.txt 2>/dev/null | head -1)
                    SETUP_EXE=$(grep "PrismLauncher-Windows-MinGW-arm64-Setup.*\.exe" assets_list.txt 2>/dev/null | head -1)
                    MAIN_ZIP=$(grep "PrismLauncher-Windows-MinGW-arm64-[^P][^o].*\.zip" assets_list.txt 2>/dev/null | head -1)
                    
                    echo "    → Found: PORTABLE='$PORTABLE_ZIP', SETUP='$SETUP_EXE', MAIN='$MAIN_ZIP'"
                    
                    DOWNLOAD_LINKS=""
                    if [ -n "$PORTABLE_ZIP" ]; then
                      FILENAME=$(echo "$PORTABLE_ZIP" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$PORTABLE_ZIP" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        echo "    → Added portable link: $FILENAME"
                      fi
                    fi
                    if [ -n "$SETUP_EXE" ]; then
                      FILENAME=$(echo "$SETUP_EXE" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$SETUP_EXE" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added setup link: $FILENAME"
                      fi
                    fi
                    if [ -n "$MAIN_ZIP" ]; then
                      FILENAME=$(echo "$MAIN_ZIP" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$MAIN_ZIP" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added main link: $FILENAME"
                      fi
                    fi
                    ;;
                  "macOS")
                    echo "    → Processing macOS platform"
                    DISPLAY_NAME="macOS"
                    # Look for both zip and dmg files
                    ZIP_ASSET=$(grep "PrismLauncher-macOS.*\.zip" assets_list.txt 2>/dev/null | head -1)
                    DMG_ASSET=$(grep "PrismLauncher-macOS.*\.dmg" assets_list.txt 2>/dev/null | head -1)
                    
                    echo "    → Found: ZIP='$ZIP_ASSET', DMG='$DMG_ASSET'"
                    
                    DOWNLOAD_LINKS=""
                    if [ -n "$ZIP_ASSET" ]; then
                      FILENAME=$(echo "$ZIP_ASSET" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$ZIP_ASSET" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        echo "    → Added ZIP link: $FILENAME"
                      fi
                    fi
                    if [ -n "$DMG_ASSET" ]; then
                      FILENAME=$(echo "$DMG_ASSET" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$DMG_ASSET" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        if [ -n "$DOWNLOAD_LINKS" ]; then
                          DOWNLOAD_LINKS="$DOWNLOAD_LINKS<br/>[$FILENAME]($URL)"
                        else
                          DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        fi
                        echo "    → Added DMG link: $FILENAME"
                      fi
                    fi
                    ;;
                  *)
                    echo "    → Processing unknown platform: $ARTIFACT_NAME"
                    DISPLAY_NAME="$ARTIFACT_NAME"
                    # Generic search for any matching file
                    ASSET=$(grep -i "$ARTIFACT_NAME" assets_list.txt 2>/dev/null | head -1)
                    echo "    → Found: ASSET='$ASSET'"
                    
                    DOWNLOAD_LINKS=""
                    if [ -n "$ASSET" ]; then
                      FILENAME=$(echo "$ASSET" | cut -d'|' -f1 2>/dev/null)
                      URL=$(echo "$ASSET" | cut -d'|' -f2 2>/dev/null)
                      if [ -n "$FILENAME" ] && [ -n "$URL" ]; then
                        DOWNLOAD_LINKS="[$FILENAME]($URL)"
                        echo "    → Added generic link: $FILENAME"
                      fi
                    fi
                    ;;
                esac
                
                # Re-enable exit on error
                set -e
                
                # Fallback if no download links found
                if [ -z "$DOWNLOAD_LINKS" ]; then
                  echo "    ⚠️ No download links found for $ARTIFACT_NAME"
                  if [ "$LATEST_RELEASE_URL" != "https://github.com/${{ github.repository }}/releases" ]; then
                    DOWNLOAD_LINKS="[Download]($LATEST_RELEASE_URL)"
                  else
                    DOWNLOAD_LINKS="[Releases](https://github.com/${{ github.repository }}/releases)"
                  fi
                else
                  echo "    ✅ Generated download links for $ARTIFACT_NAME: $DOWNLOAD_LINKS"
                fi
                
                echo "| **$DISPLAY_NAME** | $DOWNLOAD_LINKS |" >> README.md
                echo "    ✅ Added table row for $DISPLAY_NAME"
              fi
            done
          else
            echo "⚠️ No build metadata found, creating basic README"
            echo "| *Building...* | Check back soon |" >> README.md
          fi

          # Debug information
          echo ""
          echo "🔍 Debug Information:"
          echo "  • Release Tag: $LATEST_TAG"
          echo "  • Release Date: $LATEST_RELEASE_DATE"
          echo "  • Assets Found: $ASSET_COUNT"
          echo "  • Metadata Files: $(ls build-metadata/*.json 2>/dev/null | wc -l || echo 0)"

          # Clean up temporary file
          rm -f assets_list.txt

          # Add footer
          cat >> README.md << 'FOOTER'

          ---

          *Last updated: BUILD_TIME_PLACEHOLDER*
          FOOTER
          
          # Replace placeholders
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s|BUILD_TIME_PLACEHOLDER|$CURRENT_TIME|g" README.md
          
          echo "✅ README.md generated successfully"
          echo "📄 README.md preview (first 10 lines):"
          head -10 README.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if git diff --quiet README.md; then
            echo "✅ README.md unchanged, skipping commit"
          else
            git add README.md
            git commit -m "🤖 Auto-update README.md with release download links
            
            - Updated with latest release links
            - Refreshed build information
            
            [skip ci]"
            git push
            echo "✅ README.md updated and pushed"
          fi

      - name: Summary
        run: |
          echo "🎉 === CRISM LAUNCHER BUILD COMPLETED === 🎉"
          echo ""
          echo "📋 Summary:"
          echo "  • Built for all platforms ✅"
          echo "  • Retrieved API keys from upstream ✅"
          echo "  • Applied mod download bypass modifications ✅"
          echo "  • Created GitHub Release with direct downloads ✅"
          echo "  • Updated README.md with release links ✅"
          echo ""
          echo "🚀 Crism Launcher Features:"
          echo "  • Bypasses blocked mod restrictions"
          echo "  • Automatic mod downloads for CurseForge/Flame packs"
          echo "  • Direct ATLauncher mod downloads"
          echo "  • Full Prism Launcher compatibility"
          echo ""
          echo "📥 Download Links:"
          echo "  • Direct release downloads: https://github.com/${{ github.repository }}/releases/latest"
          echo "  • No login required - instant downloads!"
          echo ""
          echo "🔗 View results:"
          echo "  • Updated README: https://github.com/${{ github.repository }}"
          echo "  • Latest Release: https://github.com/${{ github.repository }}/releases/latest"
          echo "  • All Releases: https://github.com/${{ github.repository }}/releases"
