name: Build and Release

on:
  push:
    branches:
      - "develop"
      - "release-*"
      - "master"
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"
      - "COPYING.md"

      # Workflows
      - ".github/workflows/build.yml"
      - ".github/workflows/ci.yml"
      - ".github/actions/package/**"
      - ".github/actions/setup-dependencies/**"
  pull_request:
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"
      - "COPYING.md"

      # Workflows
      - ".github/workflows/build.yml"
      - ".github/workflows/ci.yml"
      - ".github/actions/package/**"
      - ".github/actions/setup-dependencies/**"
  workflow_dispatch:

# One release run at a time: each run deletes and recreates the release, so overlapping runs race.
# Queued runs wait for the running one instead of cancelling a nearly finished release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Releases are versioned <upstream major>.<upstream minor>.<run number> and the binaries are built with that
  # version, so the built-in updater sees every release as newer than the installed build. The run number only
  # grows, as long as this workflow file keeps its name.
  version:
    name: Determine version
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      patch: ${{ steps.version.outputs.patch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read upstream version
        id: version
        run: |
          major=$(sed -n 's/^set(Launcher_VERSION_MAJOR \([0-9]\+\))$/\1/p' CMakeLists.txt)
          minor=$(sed -n 's/^set(Launcher_VERSION_MINOR \([0-9]\+\))$/\1/p' CMakeLists.txt)
          if [ -z "$major" ] || [ -z "$minor" ]; then
            echo "::error::Could not read Launcher_VERSION_MAJOR/MINOR from CMakeLists.txt"
            exit 1
          fi
          patch="${{ github.run_number }}"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Release version: $major.$minor.$patch"

  build:
    name: Build (${{ matrix.artifact-name }})
    needs: version

    permissions:
      contents: read
      # Required for vcpkg binary cache
      packages: write

    # Runners, presets and Qt version track upstream's build.yml. Upstream dropped MinGW on
    # arm64 (install-qt only ships an x64 llvm-mingw Qt), so arm64 Windows is built with MSVC.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.11.2

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            cmake-preset: linux
            qt-version: 6.11.2

          - os: windows-2022
            artifact-name: Windows-MinGW-w64
            cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86
            qt-version: 6.11.2

          - os: windows-11-arm
            artifact-name: Windows-MSVC-arm64
            cmake-preset: windows_msvc
            vcvars-arch: arm64
            qt-version: 6.11.2

          - os: macos-26
            artifact-name: macOS
            cmake-preset: macos_universal
            macosx-deployment-target: 13.0
            qt-version: 6.11.2

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      VERSION: ${{ needs.version.outputs.version }}

      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Verify API keys
        shell: bash
        run: |
          for key in Launcher_MSA_CLIENT_ID Launcher_CURSEFORGE_API_KEY Launcher_IMGUR_CLIENT_ID; do
            if ! grep -q "set($key" CMakeLists.txt; then
              echo "::error::$key is missing from CMakeLists.txt"
              exit 1
            fi
          done

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      ##
      # BUILD
      ##

      # The updater and the news panel follow this repository's releases. On macOS, Sparkle must not use upstream's
      # feed (it would offer vanilla Prism): point it at the appcast published with each release, or disable it
      # without a key.
      - name: Configure project
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            feed=""
            if [ -n "$SPARKLE_PUBLIC_KEY" ]; then
              feed="https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml"
            fi
            extra+=(-D MACOSX_SPARKLE_UPDATE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" -D MACOSX_SPARKLE_UPDATE_FEED_URL="$feed")
          fi
          cmake --preset "$CMAKE_PRESET" \
            -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" \
            -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -D Launcher_UPDATER_GITHUB_REPO="https://github.com/${{ github.repository }}" \
            -D Launcher_NEWS_RSS_URL="https://github.com/${{ github.repository }}/releases.atom" \
            -D Launcher_NEWS_OPEN_URL="https://github.com/${{ github.repository }}/releases" \
            -D Launcher_FORK_PATCH_VERSION="${{ needs.version.outputs.patch }}" \
            "${extra[@]}"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      ##
      # PACKAGE
      ##

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ env.VERSION }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ env.VERSION }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ env.VERSION }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

          # No signing identity on this fork; empty values make the action skip Azure signing
          azure-client-id: ""
          azure-tenant-id: ""
          azure-subscription-id: ""

  # Asset names follow upstream's release.yml exactly: the updater picks assets by platform, architecture, Qt
  # version and "Portable" in the name, and AppImageUpdate looks for PrismLauncher-Linux-<arch>.AppImage.zsync
  # in the latest release.
  create-release:
    name: Create release
    needs: [version, build]
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release-'))
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release assets
        working-directory: artifacts
        run: |
          set -euo pipefail
          out="${{ github.workspace }}/release"
          mkdir -p "$out"

          mv PrismLauncher-Linux-Qt6-Portable*/PrismLauncher-portable.tar.gz "$out/PrismLauncher-Linux-Qt6-Portable-$VERSION.tar.gz"
          mv PrismLauncher-Linux-aarch64-Qt6-Portable*/PrismLauncher-portable.tar.gz "$out/PrismLauncher-Linux-aarch64-Qt6-Portable-$VERSION.tar.gz"

          # Branch builds name the AppImage after the version; the zsync header names the file it describes, so it
          # has to follow the rename or AppImageUpdate would fetch a file that isn't in the release
          for arch in x86_64 aarch64; do
            appimage="PrismLauncher-Linux-$arch.AppImage"
            mv PrismLauncher-*-"$arch".AppImage/PrismLauncher-*-"$arch".AppImage "$out/$appimage"
            mv PrismLauncher-*-"$arch".AppImage.zsync/PrismLauncher-*-"$arch".AppImage.zsync "$out/$appimage.zsync"
            python3 - "$out/$appimage.zsync" "$appimage" <<'PY'
          import sys
          path, name = sys.argv[1], sys.argv[2]
          data = open(path, "rb").read()
          end = data.index(b"\n\n")
          header = []
          for line in data[:end].decode().split("\n"):
              key = line.split(":", 1)[0]
              header.append(f"{key}: {name}" if key in ("Filename", "URL") else line)
          open(path, "wb").write("\n".join(header).encode() + data[end:])
          PY
            grep -a -m2 -E '^(Filename|URL):' "$out/$appimage.zsync"
          done

          mv PrismLauncher-macOS*/PrismLauncher.zip "$out/PrismLauncher-macOS-$VERSION.zip"
          mv PrismLauncher-macOS*/PrismLauncher.dmg "$out/PrismLauncher-macOS-$VERSION.dmg"

          for d in PrismLauncher-Windows-*; do
            [ -d "$d" ] || continue
            case "$d" in
              PrismLauncher-Windows-MinGW-w64*) name="PrismLauncher-Windows-MinGW-w64" ;;
              PrismLauncher-Windows-MSVC-arm64*) name="PrismLauncher-Windows-MSVC-arm64" ;;
              PrismLauncher-Windows-MSVC*) name="PrismLauncher-Windows-MSVC" ;;
              *) echo "::error::Unexpected Windows artifact $d"; exit 1 ;;
            esac
            case "$d" in
              *-Setup-*) mv "$d"/PrismLauncher-*.exe "$out/$name-Setup-$VERSION.exe" ;;
              *-Portable-*) (cd "$d" && zip -q -r -9 "$out/$name-Portable-$VERSION.zip" .) ;;
              *) (cd "$d" && zip -q -r -9 "$out/$name-$VERSION.zip" .) ;;
            esac
          done

          ls -la "$out"

      # Sparkle (macOS) reads this feed from the latest release; the ed25519 signature authenticates the update
      - name: Create Sparkle appcast
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          set -euo pipefail
          zip="release/PrismLauncher-macOS-$VERSION.zip"
          if [ -z "$SPARKLE_ED25519_KEY" ]; then
            echo "::warning::SPARKLE_ED25519_KEY is not set; macOS builds won't find updates"
            exit 0
          fi
          umask 077
          printf '%s\n' "$SPARKLE_ED25519_KEY" > sparkle.pem
          signature=$(openssl pkeyutl -sign -rawin -in "$zip" -inkey sparkle.pem | base64 -w0)
          rm -f sparkle.pem
          cat > release/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Crism Launcher</title>
              <link>https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml</link>
              <language>en</language>
              <item>
                <title>Crism Launcher $VERSION</title>
                <link>https://github.com/${{ github.repository }}/releases/tag/$VERSION</link>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <pubDate>$(date -u -R)</pubDate>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure sparkle:os="macos" url="https://github.com/${{ github.repository }}/releases/download/$VERSION/PrismLauncher-macOS-$VERSION.zip" length="$(stat -c %s "$zip")" type="application/octet-stream" sparkle:edSignature="$signature"/>
              </item>
            </channel>
          </rss>
          EOF

      # Taken before the old release is deleted: the new notes cover everything since it
      - name: Find previous release
        id: previous
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          git fetch --tags --quiet
          if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "commit=$(git rev-parse "refs/tags/$tag^{commit}")" >> "$GITHUB_OUTPUT"
            echo "Previous release: $tag"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing releases and tags
        run: |
          gh api "/repos/${{ github.repository }}/releases" --paginate --jq '.[].id' | while read -r release_id; do
            echo "Deleting release $release_id"
            gh api --method DELETE "/repos/${{ github.repository }}/releases/$release_id" || echo "Failed to delete release $release_id"
          done
          git fetch --tags --quiet
          git tag -l | while read -r tag; do
            echo "Deleting tag $tag"
            git push --delete origin "$tag" 2>/dev/null || true
            git tag -d "$tag" >/dev/null
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        env:
          PREVIOUS: ${{ steps.previous.outputs.commit }}
        run: |
          # The news panel shows these notes, so list what changed since the previous release: this fork's own
          # commits, and the upstream commits the daily sync merged in
          range="${PREVIOUS:+$PREVIOUS..}HEAD"
          limit=$([ -n "$PREVIOUS" ] && echo 200 || echo 20)

          crism=""
          while read -r hash subject; do
            case "$subject" in "🤖 Auto-update README"*) continue ;; esac
            crism+="- $subject ([${hash:0:7}](https://github.com/${{ github.repository }}/commit/$hash))"$'\n'
          done < <(git log --no-merges --first-parent --format='%H %s' -n "$limit" "$range")

          upstream=""
          while read -r merge _; do
            while read -r hash subject; do
              upstream+="- $subject ([${hash:0:7}](https://github.com/PrismLauncher/PrismLauncher/commit/$hash))"$'\n'
            done < <(git log --no-merges --format='%H %s' "$merge^1..$merge^2")
          done < <(git log --merges --first-parent --format='%H %s' -n "$limit" "$range" | grep -i upstream || true)

          {
            echo "## Changes"
            echo
            printf '%s' "${crism:-- No changes of our own in this release}"$'\n'
            if [ -n "$upstream" ]; then
              echo
              echo "## From upstream Prism Launcher"
              echo
              printf '%s' "$upstream"
            fi
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          commit: ${{ github.sha }}
          name: Crism Launcher ${{ env.VERSION }}
          bodyFile: RELEASE_BODY.md
          artifacts: "release/*"
          artifactErrorsFailBuild: true
          draft: false
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    name: Update README
    needs: create-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/${{ github.repository }}/releases/latest")
          assets=$(jq -r '.assets[] | "\(.name) \(.browser_download_url)"' <<<"$release")

          # Markdown links for the assets whose names match the regex, one per line in the cell
          links() {
            awk -v re="$1" '$1 ~ re { printf "%s[%s](%s)", (n++ ? "<br/>" : ""), $1, $2 }' <<<"$assets"
          }
          row() {
            local cell
            cell=$(links "$2")
            [ -z "$cell" ] || echo "| **$1** | $cell |"
          }

          cat > README.md <<'HEADER'
          # Crism Launcher

          [![Build Status](https://github.com/${{ github.repository }}/actions/workflows/ci.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/ci.yml)
          [![Latest Release](https://img.shields.io/github/v/release/${{ github.repository }})](https://github.com/${{ github.repository }}/releases/latest)

          A Prism Launcher fork that installs blocked mods automatically, plays without a Microsoft account, and logs in to third-party authentication servers. Rebased on upstream `develop` and synced daily.

          ## Changes from Upstream

          **Mod downloads**
          - CurseForge, FTB and ATLauncher modpacks install mods whose authors disabled third-party downloads, straight from CurseForge's file server
          - OptiFine in ATLauncher packs downloads automatically from optifine.net, with the BMCLAPI mirror as a fallback
          - Every such file is still checked against the checksum in the pack; the "blocked mods" dialog only remains for files hosted on forums or personal sites

          **Accounts**
          - Offline accounts work without owning Minecraft or adding a Microsoft account, and game files download without any account
          - authlib-injector accounts: log in to Ely.by, LittleSkin, Blessing Skin, Drasl or any Yggdrasil-compatible server (Accounts → Add authlib-injector). The agent is downloaded, verified and injected automatically, and skins can be changed where the server allows it. Fjord Launcher account files load as-is

          **Download mirror**
          - Optional (Settings → Services): fetch Minecraft, libraries, assets, Java, Forge and NeoForge from BMCLAPI or a compatible mirror, falling back to the official servers on any failure. Mirrored files are verified against the official checksums

          **Updates**
          - The built-in updater (Sparkle on macOS) follows this fork's releases, not upstream Prism's

          ### Latest Builds

          | Platform | Download |
          |----------|----------|
          HEADER

          {
            row "Windows x64" '^PrismLauncher-Windows-MinGW-w64-(Setup|Portable)-.*\.(exe|zip)$'
            row "Windows ARM64" '^PrismLauncher-Windows-MSVC-arm64-(Setup|Portable)-.*\.(exe|zip)$'
            row "macOS" '^PrismLauncher-macOS-.*\.(dmg|zip)$'
            row "Linux x86_64" '^PrismLauncher-Linux-(x86_64\.AppImage|Qt6-Portable-.*\.tar\.gz)$'
            row "Linux ARM64" '^PrismLauncher-Linux-(aarch64\.AppImage|aarch64-Qt6-Portable-.*\.tar\.gz)$'
            printf '\n---\n\n*Last updated: %s*\n' "$(date -u +'%Y-%m-%d %H:%M UTC')"
          } >> README.md

          cat README.md

      - name: Commit and push README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git add README.md
          git commit -m "🤖 Auto-update README.md with release download links" -m "[skip ci]"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push
