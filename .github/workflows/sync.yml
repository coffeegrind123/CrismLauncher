name: Sync with PrismLauncher upstream

on:
  schedule:
    # Run every day at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    # Checkout and push use PAT_TOKEN; GITHUB_TOKEN is only for the issue steps
    permissions:
      contents: read
      issues: write
    env:
      SYNC_ISSUE_TITLE: Upstream sync failed
      # The job adds an `upstream` remote, which gh would otherwise resolve to
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.PAT_TOKEN }} # Use PAT instead of GITHUB_TOKEN
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for upstream changes
        id: check_changes
        run: |
          git remote add upstream https://github.com/PrismLauncher/PrismLauncher.git
          git fetch upstream
          
          # Check if there are new commits
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/develop)
          echo "commits_behind=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "🔄 Found $BEHIND_COUNT new commits from upstream"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Already up to date with upstream"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync with upstream
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "🔄 Syncing with upstream PrismLauncher..."
          
          # Get current commit for comparison
          OLD_COMMIT=$(git rev-parse HEAD)
          
          # Get upstream commits with detailed information for changelog
          echo "📋 Upstream commits being merged:"
          git log --oneline --pretty=format:"- %s ([%h](https://github.com/PrismLauncher/PrismLauncher/commit/%H))" ${OLD_COMMIT}..upstream/develop | head -20
          
          # Create a more descriptive merge commit message (REMOVED [skip ci])
          COMMIT_COUNT=$(git rev-list --count ${OLD_COMMIT}..upstream/develop)
          git merge upstream/develop -m "Merge ${COMMIT_COUNT} commits from upstream/develop

          Synced from PrismLauncher/PrismLauncher develop branch.
          
          Changes include:
          $(git log --oneline --pretty=format:"- %s (%h)" ${OLD_COMMIT}..upstream/develop | head -10)" || git merge upstream/develop --no-edit
          
          # Get new commit
          NEW_COMMIT=$(git rev-parse HEAD)
          
          # Show what changed
          echo "📋 Successfully merged changes:"
          git log --oneline ${OLD_COMMIT}..${NEW_COMMIT}
          
          # Push changes (this will now trigger the build workflow)
          git push origin develop
          
          echo "✅ Successfully synced ${COMMIT_COUNT} commits from upstream"
          echo "🚀 Build workflow will now be triggered automatically"

      - name: No changes to sync
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ No new changes from upstream to sync"

      # One open issue at a time: later failures comment on it, the next
      # successful sync closes it.
      - name: Report sync failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          {
            if [ -n "$CONFLICTS" ]; then
              echo "Merging \`upstream/develop\` into \`develop\` conflicts in:"
              echo
              while IFS= read -r f; do
                echo "- \`$f\`"
              done <<< "$CONFLICTS"
              echo
              echo "Resolve locally (\`git merge upstream/develop\`) and push to \`develop\`."
            else
              echo "The sync job failed without a merge conflict. See the run log."
            fi
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/sync-issue.md"

          ISSUE=$(gh issue list --state open --search "in:title \"$SYNC_ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.SYNC_ISSUE_TITLE))[0].number // empty")
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/sync-issue.md"
          else
            gh issue create --title "$SYNC_ISSUE_TITLE" --body-file "$RUNNER_TEMP/sync-issue.md"
          fi

      - name: Close sync failure issue
        if: success()
        run: |
          ISSUE=$(gh issue list --state open --search "in:title \"$SYNC_ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.SYNC_ISSUE_TITLE))[0].number // empty")
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "Sync succeeded: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
